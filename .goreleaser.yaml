version: 2
project_name: websubhub

builds:
  - id: websubhub
    main: ./cmd/websubhub
    binary: bin/websubhub
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -buildvcs=false
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/ayeshLK/websubhub/internal/buildinfo.version=v{{ .Version }}
        -X github.com/ayeshLK/websubhub/internal/buildinfo.commit={{ .FullCommit }}
        -X github.com/ayeshLK/websubhub/internal/buildinfo.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: websubhub-consolidator
    main: ./cmd/websubhub-consolidator
    binary: bin/websubhub-consolidator
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -buildvcs=false
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/ayeshLK/websubhub/internal/buildinfo.version=v{{ .Version }}
        -X github.com/ayeshLK/websubhub/internal/buildinfo.commit={{ .FullCommit }}
        -X github.com/ayeshLK/websubhub/internal/buildinfo.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: websubhub
    ids: [websubhub]
    name_template: "websubhub_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    wrap_in_directory: "websubhub_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      group: root
      owner: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: packaging/websubhub/README.md
        dst: .
        strip_parent: true
        info: &file_info
          group: root
          owner: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: packaging/websubhub/config/websubhub.toml
        dst: config
        strip_parent: true
        info: *file_info
      - src: LICENSE
        info: *file_info
      - src: NOTICE
        info: *file_info
  - id: websubhub-consolidator
    ids: [websubhub-consolidator]
    name_template: "websubhub-consolidator_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    wrap_in_directory: "websubhub-consolidator_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      group: root
      owner: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: packaging/websubhub-consolidator/README.md
        dst: .
        strip_parent: true
        info: *file_info
      - src: packaging/websubhub-consolidator/config/websubhub-consolidator.toml
        dst: config
        strip_parent: true
        info: *file_info
      - src: LICENSE
        info: *file_info
      - src: NOTICE
        info: *file_info

sboms:
  - id: archives
    artifacts: archive
    disable: false

checksum:
  name_template: "websubhub_{{ .Version }}_checksums.txt"
  algorithm: sha256

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

release:
  draft: true
  prerelease: auto

changelog:
  use: github-native

report_sizes: true
