name: Release
run-name: Release declared version from main

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    outputs:
      build-date: ${{ steps.release.outputs.build-date }}
      previous-tag: ${{ steps.release.outputs.previous-tag }}
      dispatch-sha: ${{ steps.release.outputs.dispatch-sha }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    services:
      kafka:
        image: apache/kafka@sha256:bff074a5d0051dbc0bbbcd25b045bb1fe84833ec0d3c7c965d1797dd289ec88f
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate and validate release candidate
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "release workflow must be dispatched from main" >&2
            exit 1
          fi
          git fetch --force --tags origin
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "dispatched commit is no longer the current main commit" >&2
            exit 1
          fi

          calculation=$(sh scripts/release-version.sh release)
          printf '%s\n' "$calculation" >> "$GITHUB_OUTPUT"
          tag=$(printf '%s\n' "$calculation" | sed -n 's/^tag=//p')
          source_sha=$GITHUB_SHA
          resume=false
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            source_sha=$(git rev-list -n 1 "refs/tags/$tag")
            if ! git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"; then
              echo "existing release tag $tag is not an ancestor of current main" >&2
              exit 1
            fi

            allowed='^(\.github/workflows/release\.yml|scripts/release-version\.sh|scripts/verify-release-version\.sh|docs/architecture/decisions/0020-automated-release-authority\.md|docs/releasing\.md)$'
            unexpected=$(git diff --name-only "$source_sha" "$GITHUB_SHA" | grep -Ev "$allowed" || true)
            if [[ -n "$unexpected" ]]; then
              echo "current main contains non-release changes after $tag:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi

            git show "$source_sha:release.properties" > "$RUNNER_TEMP/tag-release.properties"
            tagged=$(sh scripts/release-version.sh release "$RUNNER_TEMP/tag-release.properties" - | sed -n 's/^tag=//p')
            if [[ "$tagged" != "$tag" ]]; then
              echo "tagged source declares $tagged, not $tag" >&2
              exit 1
            fi
            if release_lookup=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>&1); then
              echo "a GitHub Release already exists for $tag; this workflow cannot resume it" >&2
              exit 1
            elif ! grep -q 'HTTP 404' <<< "$release_lookup"; then
              echo "could not verify that no GitHub Release exists for $tag" >&2
              printf '%s\n' "$release_lookup" >&2
              exit 1
            fi
            resume=true
          fi

          echo "resume=$resume" >> "$GITHUB_OUTPUT"
          echo "dispatch-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "build-date=$(git show -s --format=%cI "$source_sha")" >> "$GITHUB_OUTPUT"
      - name: Summarize release candidate
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.sha }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous-tag }}
          RESUME: ${{ steps.release.outputs.resume }}
        run: |
          {
            echo "## Release candidate"
            echo
            echo "- Tag: \`$TAG\`"
            echo "- Commit: \`$SHA\`"
            echo "- Previous stable tag: \`${PREVIOUS_TAG:-none}\`"
            echo "- Resume existing tag: \`$RESUME\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check out verified release source
        env:
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
        run: git checkout --detach "$SOURCE_SHA"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: true
      - name: Run complete source checks
        run: make check
      - name: Run Kafka provider integration tests
        env:
          WEBSUBHUB_TEST_KAFKA_BROKERS: 127.0.0.1:9092
        run: make test-integration-kafka

  publish:
    name: Publish release distributions
    needs: verify
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: true
      - name: Create or verify immutable release tag
        env:
          DISPATCH_SHA: ${{ needs.verify.outputs.dispatch-sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          git fetch --force --tags origin
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$DISPATCH_SHA" ]]; then
            echo "verified main commit has changed" >&2
            exit 1
          fi
          declared=$(sed -n 's/^version=//p' release.properties)
          if [[ "v$declared" != "$TAG" ]]; then
            echo "release source declares $declared, not $TAG" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            target=$(git rev-list -n 1 "refs/tags/$TAG")
            if [[ "$target" != "$SHA" ]]; then
              echo "existing release tag $TAG targets $target, not $SHA" >&2
              exit 1
            fi
            if release_lookup=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1); then
              echo "a GitHub Release already exists for $TAG; refusing to overwrite it" >&2
              exit 1
            elif ! grep -q 'HTTP 404' <<< "$release_lookup"; then
              echo "could not verify that no GitHub Release exists for $TAG" >&2
              printf '%s\n' "$release_lookup" >&2
              exit 1
            fi
            echo "resuming $TAG at the verified tagged source"
          else
            if [[ "$SHA" != "$DISPATCH_SHA" ]]; then
              echo "a new tag can only be created for the verified main commit" >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$SHA" -m "WebSubHub $TAG"
            git push origin "refs/tags/$TAG"
          fi
      - name: Generate deterministic release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_TAG: ${{ needs.verify.outputs.previous-tag }}
          SHA: ${{ needs.verify.outputs.sha }}
          TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          cp .github/release-notes/developer-preview.md "$RUNNER_TEMP/release-notes.md"
          printf '\n## Changes\n\n' >> "$RUNNER_TEMP/release-notes.md"
          args=(--method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$TAG" -f "target_commitish=$SHA")
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(-f "previous_tag_name=$PREVIOUS_TAG")
          fi
          gh api "${args[@]}" --jq .body >> "$RUNNER_TEMP/release-notes.md"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: true
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build and stage the draft GitHub release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.verify.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.verify.outputs.previous-tag }}
      - name: Verify component archive layout
        run: sh scripts/verify-release.sh
      - name: Attest tarball provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Attest ZIP provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ayeshalmeida
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Publish websubhub image
        id: hub-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: websubhub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/ayeshalmeida/websubhub:${{ needs.verify.outputs.version }}
          build-args: |
            VERSION=${{ needs.verify.outputs.tag }}
            COMMIT=${{ needs.verify.outputs.sha }}
            BUILD_DATE=${{ needs.verify.outputs.build-date }}
          sbom: true
          provenance: mode=max
      - name: Publish consolidator image
        id: consolidator-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: websubhub-consolidator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/ayeshalmeida/websubhub-consolidator:${{ needs.verify.outputs.version }}
          build-args: |
            VERSION=${{ needs.verify.outputs.tag }}
            COMMIT=${{ needs.verify.outputs.sha }}
            BUILD_DATE=${{ needs.verify.outputs.build-date }}
          sbom: true
          provenance: mode=max
      - name: Sign container images
        env:
          HUB_DIGEST: ${{ steps.hub-image.outputs.digest }}
          CONSOLIDATOR_DIGEST: ${{ steps.consolidator-image.outputs.digest }}
        run: |
          cosign sign --yes "docker.io/ayeshalmeida/websubhub@$HUB_DIGEST"
          cosign sign --yes "docker.io/ayeshalmeida/websubhub-consolidator@$CONSOLIDATOR_DIGEST"
      - name: Attest websubhub image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/ayeshalmeida/websubhub
          subject-digest: ${{ steps.hub-image.outputs.digest }}
          push-to-registry: true
      - name: Attest consolidator image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/ayeshalmeida/websubhub-consolidator
          subject-digest: ${{ steps.consolidator-image.outputs.digest }}
          push-to-registry: true
      - name: Publish GitHub release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --verify-tag

  advance-development:
    name: Open next development version pull request
    needs:
      - verify
      - publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true
      - name: Advance to the next patch snapshot
        id: next
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          git fetch --force --tags origin
          current_tag=$(sh scripts/release-version.sh inspect release.properties - | sed -n 's/^tag=//p')
          state=$(sh scripts/release-version.sh inspect release.properties - | sed -n 's/^state=//p')
          if [[ "$state" != "release" || "$current_tag" != "$RELEASE_TAG" ]]; then
            echo "main no longer declares the published release $RELEASE_TAG" >&2
            exit 1
          fi

          calculation=$(sh scripts/release-version.sh next-snapshot)
          printf '%s\n' "$calculation" >> "$GITHUB_OUTPUT"
      - name: Create next development version pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.next.outputs.property-version }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          branch="automation/next-development-${NEXT_VERSION%-SNAPSHOT}"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "next development branch already exists: $branch" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add release.properties
          git commit -m "Start $NEXT_VERSION development"
          git push origin "$branch"

          {
            echo "Advances the repository to $NEXT_VERSION after publishing $RELEASE_TAG."
            echo
            echo "This pull request was created by the protected release workflow. Its CI runs require maintainer approval when created with GITHUB_TOKEN."
          } > pull-request-body.md
          gh pr create --base main --head "$branch" --title "Start $NEXT_VERSION development" --body-file pull-request-body.md
